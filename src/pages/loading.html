<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #172033; background: #f4f7fc; }
      main { width: min(380px, calc(100vw - 56px)); text-align: center; }
      img { width: 104px; height: 104px; }
      h1 { margin: 20px 0 6px; font-size: 24px; letter-spacing: -.02em; text-wrap: balance; }
      .context { margin: 0; color: #526078; font-size: 13px; }
      .status { margin-top: 36px; }
      #message { margin: 0 0 14px; min-height: 21px; color: #344158; font-size: 14px; font-weight: 560; text-wrap: pretty; }
      .progress { width: 100%; height: 6px; overflow: hidden; border-radius: 999px; background: #dce4f0; }
      .progress__fill { width: 100%; height: 100%; border-radius: inherit; background: #4d6bfe; transform: scaleX(.08); transform-origin: left center; transition: transform 240ms cubic-bezier(.22, 1, .36, 1); }
      .progress-meta { display: flex; justify-content: space-between; margin-top: 10px; color: #65738b; font-size: 12px; }
      #progress-value { min-width: 4ch; color: #43516a; font-variant-numeric: tabular-nums; text-align: right; }
      @media (prefers-color-scheme: dark) {
        body { color: #f2f6ff; background: #0c121d; }
        .context, .progress-meta { color: #9eacc2; }
        #message { color: #dce5f5; }
        .progress { background: #26344a; }
        #progress-value { color: #bdc9db; }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress__fill { transition-duration: 0ms; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../../assets/icon.png" alt="">
      <h1>DSH Desktop</h1>
      <p class="context" id="context">Local Harness runtime</p>
      <section class="status" aria-live="polite">
        <p id="message">Preparing the desktop window…</p>
        <div class="progress" id="progress" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
        <div class="progress-meta" aria-hidden="true">
          <span id="progress-label">Starting locally</span>
          <span id="progress-value">8%</span>
        </div>
      </section>
    </main>
    <script>
      const query = new URLSearchParams(location.search)
      const zh = query.get('lang') === 'zh'
      const message = document.querySelector('#message')
      const progress = document.querySelector('#progress')
      const progressFill = document.querySelector('#progress-fill')
      const progressValue = document.querySelector('#progress-value')
      document.documentElement.lang = zh ? 'zh-CN' : 'en'
      document.querySelector('#context').textContent = zh ? '本地 Harness 运行环境' : 'Local Harness runtime'
      document.querySelector('#progress-label').textContent = zh ? '正在本机启动' : 'Starting locally'
      progress.setAttribute('aria-label', zh ? '启动进度' : 'Startup progress')

      window.setStartupState = (state = {}) => {
        const value = Math.min(100, Math.max(0, Math.round(Number(state.progress) || 0)))
        message.textContent = state.message || (zh ? '正在准备桌面窗口…' : 'Preparing the desktop window…')
        progress.setAttribute('aria-valuenow', String(value))
        progressFill.style.transform = `scaleX(${String(value / 100)})`
        progressValue.textContent = `${String(value)}%`
      }

      window.setStartupState({
        message: query.get('message'),
        progress: query.get('progress') || 8,
      })
    </script>
  </body>
</html>
