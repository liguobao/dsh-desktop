<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #172033; background: radial-gradient(circle at 50% 35%, #e8f2ff 0, #f6f8fc 45%, #eef2f8 100%); }
      main { width: min(420px, calc(100vw - 48px)); padding: 42px; text-align: center; border: 1px solid rgba(70, 96, 145, .12); border-radius: 28px; background: rgba(255, 255, 255, .72); box-shadow: 0 24px 80px rgba(26, 52, 92, .12); backdrop-filter: blur(16px); }
      img { width: 84px; height: 84px; filter: drop-shadow(0 12px 24px rgba(43, 113, 235, .24)); }
      h1 { margin: 22px 0 9px; font-size: 24px; letter-spacing: -.02em; }
      p { margin: 0; min-height: 24px; color: #63708a; font-size: 14px; }
      .loader { width: 120px; height: 3px; margin: 28px auto 0; overflow: hidden; border-radius: 99px; background: #d9e2f2; }
      .loader::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2768eb, #42c9db); animation: move 1.15s ease-in-out infinite alternate; }
      @keyframes move { from { transform: translateX(-15%); } to { transform: translateX(140%); } }
      @media (prefers-color-scheme: dark) { body { color: #f2f6ff; background: radial-gradient(circle at 50% 35%, #17294a 0, #0d1421 52%, #080d16 100%); } main { border-color: rgba(136, 167, 219, .16); background: rgba(20, 30, 48, .76); } p { color: #aebbd0; } .loader { background: #25344c; } }
    </style>
  </head>
  <body>
    <main>
      <img src="../../assets/icon.png" alt="">
      <h1>DSH Desktop</h1>
      <p id="message">Starting DeepSeek Harness…</p>
      <div class="loader" aria-label="Loading"></div>
    </main>
    <script>
      const query = new URLSearchParams(location.search)
      document.documentElement.lang = query.get('lang') === 'zh' ? 'zh-CN' : 'en'
      document.querySelector('#message').textContent = query.get('message') || 'Starting DeepSeek Harness…'
    </script>
  </body>
</html>
