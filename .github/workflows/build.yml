name: Build and release

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            script: dist:linux
            arch: --x64
            artifact: linux-x64
          - name: Windows x64
            runner: windows-latest
            script: dist:windows
            arch: --x64
            artifact: windows-x64
          - name: macOS Intel
            runner: macos-15-intel
            script: dist:mac
            arch: --x64
            artifact: macos-x64
          - name: macOS Apple Silicon
            runner: macos-15
            script: dist:mac
            arch: --arm64
            artifact: macos-arm64

    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Build packages
        run: npm run ${{ matrix.script }} -- ${{ matrix.arch }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "DSH Desktop $RELEASE_TAG"
