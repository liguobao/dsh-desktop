name: Build and release

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            script: dist:linux
            arch: --x64
            artifact: linux-x64
          - name: Windows x64
            runner: windows-latest
            script: dist:windows
            arch: --x64
            artifact: windows-x64
          - name: macOS Intel
            runner: macos-15-intel
            script: dist:mac
            arch: --x64
            artifact: macos-x64
          - name: macOS Apple Silicon
            runner: macos-15
            script: dist:mac
            arch: --arm64
            artifact: macos-arm64

    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Expected tag ' + expected + ', received ' + process.env.GITHUB_REF_NAME); process.exit(1) }"

      - name: Run tests
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Build packages
        run: npm run ${{ matrix.script }} -- ${{ matrix.arch }}

      - name: Verify Windows package variants
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter 'DSH-Desktop-v*-windows-*-setup.exe')
          $portable = @(Get-ChildItem dist -Filter 'DSH-Desktop-v*-windows-*-portable.exe')
          if ($setup.Count -ne 1) { throw "Expected one Windows setup package, found $($setup.Count)" }
          if ($portable.Count -ne 1) { throw "Expected one Windows portable package, found $($portable.Count)" }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: dsh-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "DSH Desktop $RELEASE_TAG"

      - name: Upload release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
